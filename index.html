<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Portal RMS · novo endereço</title>
<meta name="robots" content="noindex">
<meta http-equiv="refresh" content="3;url=https://portal-requisicao-material.github.io/">
<link rel="canonical" href="https://portal-requisicao-material.github.io/">
<style>
:root{--verde:#84BD00;--verde-txt:#4F7A00;--grafite:#334155;--fundo:#ffffff;--linha:#e2e8f0}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--fundo);color:var(--grafite);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:16px}
.c{max-width:460px;width:100%;border:1px solid var(--linha);border-radius:14px;padding:28px;text-align:center;box-shadow:0 10px 30px rgba(15,23,42,.06)}
.logo{display:inline-grid;place-items:center;width:52px;height:52px;border-radius:12px;background:var(--verde);color:#1a2e05;font-weight:800;letter-spacing:.02em;margin-bottom:14px}
h1{font-size:20px;margin:0 0 8px}
p{margin:0 0 18px;color:#64748b}
a.b{display:inline-block;background:var(--verde);color:#1a2e05;font-weight:700;text-decoration:none;padding:12px 20px;border-radius:10px}
.u{display:block;margin-top:14px;font-size:13px;color:var(--verde-txt);word-break:break-all}
</style>
</head>
<body>
<main class="c">
  <div class="logo">RMS</div>
  <h1>O portal mudou de endereço</h1>
  <p>Você será levado ao novo endereço em instantes. Atualize seus favoritos e, no celular, reinstale o app pelo link novo.</p>
  <a class="b" id="ir" href="https://portal-requisicao-material.github.io/">Abrir o portal</a>
  <span class="u">portal-requisicao-material.github.io</span>
</main>
<script>
(function(){
  var novo="https://portal-requisicao-material.github.io/"+(location.hash||"");
  document.getElementById("ir").href=novo;
  // desliga o app antigo (cache) deste endereço para não abrir a versão velha
  try{ if(navigator.serviceWorker) navigator.serviceWorker.getRegistrations().then(function(rs){ rs.forEach(function(r){ r.unregister(); }); }); }catch(e){}
  try{ if(window.caches) caches.keys().then(function(ks){ ks.forEach(function(k){ caches.delete(k); }); }); }catch(e){}
  setTimeout(function(){ location.replace(novo); }, 1500);
})();
</script>
</body>
</html>
